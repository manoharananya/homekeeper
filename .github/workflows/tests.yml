name: tests

# Runs on GitHub's servers on every push and pull request:
# installs HomeKeeper on Linux and macOS, runs the test suite and the full demo.
on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Demo end to end
        env:
          COLUMNS: "110"
        run: |
          python -m homekeeper demo
          python -m homekeeper --home homekeeper_demo list
          python -m homekeeper --home homekeeper_demo warranty
          python -m homekeeper --home homekeeper_demo claim 2
          python -m homekeeper --home homekeeper_demo order kent --print-only
          python -m homekeeper --home homekeeper_demo export
          python -m homekeeper --home homekeeper_demo net report
