name: tests

# Runs on GitHub's servers on every push and pull request:
# installs HomeKeeper, runs the test suite and the full demo.
# Linux only: free macOS runners were never assigned in run #1 (AI_LOG #18).
on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Demo end to end
        env:
          COLUMNS: "110"
        run: |
          python -m homekeeper demo
          python -m homekeeper --home homekeeper_demo list
          python -m homekeeper --home homekeeper_demo warranty
          python -m homekeeper --home homekeeper_demo claim 2
          python -m homekeeper --home homekeeper_demo order kent --print-only
          python -m homekeeper --home homekeeper_demo export
          python -m homekeeper --home homekeeper_demo net report
